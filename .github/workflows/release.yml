name: Release

# 태그를 밀면 mac/Windows 설치본을 만들어 해당 릴리스에 붙인다.
# 이미 발행된 릴리스에 빠진 플랫폼만 채우고 싶을 때는 workflow_dispatch로 태그를 지정해 돌린다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '빌드해서 첨부할 태그 (예: v0.1.1)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # electron-builder는 CI에서 태그를 만나면 스스로 GitHub에 publish하려 든다.
      # 업로드는 아래 gh 스텝이 --clobber로 처리하므로 여기서는 빌드만 한다.
      - name: Windows 설치본 빌드
        run: npm run dist -- --win --publish never
      - name: 릴리스에 첨부
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" dist/*.exe --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # arm64와 x64를 한 번에 빌드하면 두 dmg가 같은 볼륨 이름(Portfolio <버전>)으로
      # 동시에 마운트되어 ln -s /Applications 와 hdiutil detach 가 서로를 밟는다.
      # 아키텍처를 나눠 순차로 만든다.
      - name: macOS 설치본 빌드 (arm64)
        run: npm run dist:mac -- --arm64 --publish never
      - name: macOS 설치본 빌드 (x64)
        run: npm run dist:mac -- --x64 --publish never
      - name: 릴리스에 첨부
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          files=(dist/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "dmg가 만들어지지 않았습니다." >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
